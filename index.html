<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2X Test Animation — ทางพิเศษฉลองรัช</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; font-family: "Sarabun", "Tahoma", "Segoe UI", sans-serif; }
  #map { position: absolute; inset: 0; background: #1b1f27; }
  .panel { position: absolute; z-index: 1000; background: rgba(18,22,30,.92); color: #eef2f7; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.5); font-size: 13px; }
  #ctl { top: 10px; right: 10px; width: 262px; padding: 10px 12px; }
  #ctl h3 { margin: 0 0 6px; font-size: 14px; }
  #ctl .sub { color: #9fb0c4; font-size: 11.5px; margin-bottom: 8px; }
  .rt { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 6px; cursor: pointer; }
  .rt:hover { background: rgba(255,255,255,.07); }
  .rt input { accent-color: #ffd60a; width: 16px; height: 16px; }
  .sw { width: 22px; height: 6px; border-radius: 3px; flex: none; }
  .rt small { color: #9fb0c4; display: block; font-size: 11px; }
  .row { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  button { background: #2a3140; color: #fff; border: 1px solid #3d475b; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #38425a; }
  button.primary { background: #1f7ae0; border-color: #3b92f5; font-weight: 600; min-width: 84px; }
  select { background: #2a3140; color: #fff; border: 1px solid #3d475b; border-radius: 6px; padding: 5px; font: inherit; }
  label.chk { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12.5px; }
  #hud { left: 10px; bottom: 10px; width: 360px; padding: 8px 10px; max-width: calc(100% - 40px); }
  .hr { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .hr:last-child { border: 0; }
  .hr .t { display: flex; justify-content: space-between; font-weight: 600; }
  .hr .km { font-variant-numeric: tabular-nums; color: #cfe0f5; font-weight: 500; }
  .bar { height: 12px; background: #2a3140; border-radius: 6px; margin: 6px 0 14px; position: relative; cursor: pointer; touch-action: none; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; pointer-events: none; }
  .bar u { position: absolute; top: -3px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: #fff; border: 3px solid var(--c); box-shadow: 0 1px 4px rgba(0,0,0,.6); pointer-events: none; text-decoration: none; }
  .bar b { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: rgba(255,255,255,.7); pointer-events: none; }
  .bar em { position: absolute; top: 14px; transform: translateX(-50%); font-style: normal; font-size: 9px; color: #9fb0c4; pointer-events: none; white-space: nowrap; }
  .seekhint { font-size: 10.5px; color: #7f90a6; margin-top: 2px; }
  .hr .st { font-size: 12px; color: #9fb0c4; min-height: 16px; }
  .hr .st b { color: #fff; }
  #legend { left: 10px; top: 10px; padding: 8px 12px; font-size: 12px; line-height: 1.7; }
  #legend .dot { display: inline-block; width: 16px; height: 5px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  /* car */
  .car { width: 34px; height: 34px; border-radius: 50%; background: #10151c; border: 3px solid var(--c); box-shadow: 0 0 0 3px rgba(255,255,255,.55), 0 2px 8px rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; }
  .car svg { width: 20px; height: 20px; }
  .carlab { position: absolute; top: 38px; left: 50%; transform: translateX(-50%); background: var(--c); color: #111; font-weight: 700; font-size: 11px; padding: 1px 6px; border-radius: 8px; white-space: nowrap; }
  /* use-case bubble */
  .bub { width: 244px; background: #fff; color: #172033; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.55); border: 3px solid var(--c); transform-origin: 50% 100%; animation: pop .35s cubic-bezier(.2,1.6,.4,1); position: relative; }
  .bub:after { content: ""; position: absolute; left: 50%; bottom: -12px; margin-left: -9px; border: 9px solid transparent; border-top-color: var(--c); border-bottom: 0; }
  @keyframes pop { from { transform: scale(.3); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .bub .hd { background: var(--c); color: #111; font-weight: 700; font-size: 12px; padding: 3px 8px; display: flex; justify-content: space-between; }
  .bub .pics { display: flex; justify-content: center; gap: 6px; padding: 8px 6px 2px; }
  .bub .pics svg { width: 54px; height: 54px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
  .bub .nm { text-align: center; font-weight: 700; font-size: 12.5px; padding: 0 8px; }
  .bub .msg { margin: 6px 8px 4px; background: #101820; color: #ffb400; font-family: Consolas, monospace; font-size: 12px; font-weight: 700; text-align: center; padding: 4px 6px; border-radius: 5px; letter-spacing: .3px; }
  .bub .zn { text-align: center; font-size: 11.5px; padding: 0 8px 7px; color: #455; }
  .bub .zn b { color: #c0392b; }
  .emg { width: 34px; height: 34px; border-radius: 50%; background: #10151c; border: 3px solid #ff3b30; display: flex; align-items: center; justify-content: center; position: relative; animation: fl .5s infinite alternate; }
  .emg svg { width: 22px; height: 22px; } .sir { fill: #ff3b30; animation: sr .35s infinite alternate; }
  @keyframes fl { from { box-shadow: 0 0 0 3px rgba(255,255,255,.6), 0 0 16px #ff3b30 } to { box-shadow: 0 0 0 3px rgba(255,255,255,.6), 0 0 16px #1f7ae0 } }
  @keyframes sr { from { fill: #ff3b30 } to { fill: #3b92f5 } }
  .place { position: absolute; right: 100%; margin-right: 12px; white-space: nowrap; bottom: 6px; min-width: 112px; max-width: 190px; background: var(--pc); color: #fff; border: 3px solid #fff; border-radius: 9px; padding: 5px 11px 6px; text-align: center; font-weight: 700; box-shadow: 0 3px 12px rgba(0,0,0,.55); animation: pop .4s cubic-bezier(.2,1.6,.4,1) .12s backwards; line-height: 1.2; }
  .place small { display: block; font-size: 11px; opacity: .92; font-weight: 600; }
  .place span { font-size: 16px; }
  .lcsmk { position: absolute; transform: translate(-20px, -34px); text-align: center; white-space: nowrap; filter: drop-shadow(0 1px 3px rgba(0,0,0,.8)); }
  .lcsmk svg { display: block; margin: 0 auto; }
  .lcsmk b { display: block; font-size: 10px; background: #111; color: #fff; padding: 0 5px; border-radius: 3px; margin-top: 1px; }
  .lcsmk i { display: block; font-style: normal; font-size: 9.5px; background: #fff; color: #111; padding: 0 5px; border-radius: 3px; }
  .lcscard { position: absolute; right: 150px; bottom: -34px; width: 205px; background: #fff; color: #172033; border: 3px solid #0a7d3b; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.6); animation: pop .35s cubic-bezier(.2,1.6,.4,1); overflow: hidden; }
  .lcscard .hd { background: #0a7d3b; color: #fff; font-weight: 700; font-size: 12px; padding: 3px 8px; display: flex; justify-content: space-between; }
  .lcscard img { display: block; width: 100%; }
  .lcscard .ft { font-size: 11.5px; padding: 4px 8px 6px; text-align: center; }
  .tcb { background: #fff; border: 2px solid var(--c); color: #111; font-weight: 700; font-size: 10.5px; padding: 0 4px; border-radius: 4px; white-space: nowrap; }
  .rsulab { background: #111; color: var(--c); border: 0; font-weight: 700; font-size: 11px; box-shadow: none; padding: 1px 5px; }
  .leaflet-tooltip.rsulab:before { display: none; }
  .tip { background: rgba(0,0,0,.8); color: #fff; border: 0; font-size: 11px; }
</style>
</head>

// ---------------- helpers ----------------
function fmtKm(m) { m = Math.round(m); return "KM" + Math.floor(m / 1000) + "+" + String(((m % 1000) + 1000) % 1000).padStart(3, "0"); }
function posAt(R, c) {
  const p = R.path; c = Math.max(0, Math.min(R.len, c));
  let lo = 0, hi = p.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (p[mid][2] <= c) lo = mid; else hi = mid; }
  const a = p[lo], b = p[hi], t = b[2] === a[2] ? 0 : (c - a[2]) / (b[2] - a[2]);
  return [a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])];
}
function sliceLL(R, c0, c1) {
  const out = [posAt(R, c0)];
  for (const q of R.path) if (q[2] > c0 && q[2] < c1) out.push([q[0], q[1]]);
  out.push(posAt(R, c1)); return out;
}
function kmAt(R, c) {
  const k = R.cumKm, i = Math.max(0, Math.min(k.length - 2, Math.floor(c / 250))), t = (c - i * 250) / 250;
  return k[i] + t * (k[i + 1] - k[i]);
}

// ---------------- build routes ----------------
const state = {};
ROUTE_DEFS.forEach(d => {
  const R = ROUTES[d.id], B = BRAND[d.b], col = B.color;
  const g = L.layerGroup(), gz = L.layerGroup(), gr = L.layerGroup();
  // road line
  L.polyline(R.path.map(p => [p[0], p[1]]), { color: "#000", weight: 9, opacity: .55 }).addTo(g);
  L.polyline(R.path.map(p => [p[0], p[1]]), { color: col, weight: 5, opacity: .95 }).addTo(g);
  // direction arrows (small chevrons every ~2.5 km)
  for (let c = 1200; c < R.len; c += 2500) {
    const a = posAt(R, c - 25), b = posAt(R, c + 25), ang = Math.atan2((b[1] - a[1]) * Math.cos(a[0] * Math.PI / 180), b[0] - a[0]) * 180 / Math.PI;
    L.marker(posAt(R, c), { interactive: false, icon: L.divIcon({ className: "", iconSize: [14, 14], iconAnchor: [7, 7], html: '<svg width="14" height="14" viewBox="0 0 14 14" style="transform:rotate(' + (90 - ang) + 'deg)"><path d="M2 11 L7 3 L12 11 L7 8.5Z" fill="#111" stroke="#fff" stroke-width="1"/></svg>' }) }).addTo(g);
  }
  // zones
  R.scenes.forEach(s => s.zones.forEach(z => {
    z.line = L.polyline(sliceLL(R, z.a, z.b), { color: /Rel/.test(z.n) ? "#ff453a" : "#ff9f0a", weight: 8, opacity: .85, lineCap: "butt" }).addTo(gz)
      .bindTooltip(s.tc + " · " + z.n + " (" + fmtKm(z.ka) + " → " + fmtKm(z.kb) + ")", { sticky: true, className: "tip" });
  }));
  // RSU
  R.rsu.forEach(r => {
    L.circle([r.lat, r.lon], { radius: 1000, color: col, weight: 2, opacity: .7, fillColor: col, fillOpacity: .07, interactive: false }).addTo(gr);
    const off = d.b === "K" ? [36, 17] : [-2, 17];
    L.marker([r.lat, r.lon], { icon: L.divIcon({ className: "", iconSize: [34, 34], iconAnchor: off, html: '<img src="' + B.rsu + '" style="width:34px;height:34px">' }) })
      .bindTooltip(B.name + " " + r.id + " · " + fmtKm(r.km), { className: "tip" }).addTo(gr);
  });
  // real LCS gantries (KMZ folder "LCS") = start of Relevant Zone I / II / III of T5 inbound
  (R.lcs || []).forEach(l => {
    L.marker([l.lat, l.lon], { zIndexOffset: 2000, icon: L.divIcon({ className: "", iconSize: [0, 0], html: '<div class="lcsmk"><svg viewBox="0 0 40 30" width="40" height="30"><rect x="1" y="1" width="38" height="5" rx="1" fill="#6b7280" stroke="#111"/><rect x="3" y="6" width="3" height="22" fill="#6b7280"/><rect x="34" y="6" width="3" height="22" fill="#6b7280"/><rect x="7" y="7" width="7" height="8" fill="#0a0" stroke="#111"/><rect x="16.5" y="7" width="7" height="8" fill="#0a0" stroke="#111"/><rect x="26" y="7" width="7" height="8" fill="#0a0" stroke="#111"/></svg><b>' + l.id + '</b><i>KM' + Math.floor(l.km / 1000) + '+' + String(l.km % 1000).padStart(3, "0") + '</i></div>' }) })
      .bindTooltip("ป้าย LCS " + l.id + " (Lane Changing System) · จุดเริ่ม Relevant Zone · KM" + Math.floor(l.km / 1000) + "+" + String(l.km % 1000).padStart(3, "0"), { className: "tip" }).addTo(g);
  });
  // use-case dots
  R.scenes.forEach(s => {
    s.mk = L.circleMarker([s.lat, s.lon], { radius: 8, color: col, weight: 3, fillColor: "#fff", fillOpacity: 1 }).addTo(g)
      .bindTooltip(s.tc + " · " + NAMES[s.tc] + "<br>Pictogram " + fmtKm(s.km), { className: "tip" });
    L.marker([s.lat, s.lon], { interactive: false, icon: L.divIcon({ className: "", iconSize: [0, 0], html: '<span class="tcb" style="--c:' + col + ';position:absolute;transform:translate(-50%,10px)">' + s.tc + '</span>' }) }).addTo(g);
  });
  // start / end labels
  const st = posAt(R, 0), en = posAt(R, R.len);
  L.marker(st, { interactive: false, icon: L.divIcon({ className: "", iconSize: [0, 0], html: '<span class="tcb" style="--c:' + col + ';position:absolute;transform:translate(-50%,-22px)">START</span>' }) }).addTo(g);
  L.marker(en, { interactive: false, icon: L.divIcon({ className: "", iconSize: [0, 0], html: '<span class="tcb" style="--c:' + col + ';position:absolute;transform:translate(-50%,-22px)">END</span>' }) }).addTo(g);
  // car
  const carMk = L.marker(st, { zIndexOffset: 5000, interactive: false, icon: L.divIcon({ className: "", iconSize: [34, 34], iconAnchor: [17, 17], html: '<div class="car" style="--c:' + col + '">' + CAR_SVG + '<span class="carlab">' + B.name + ' ' + (d.id.endsWith("out") ? "→จตุโชติ" : "→อาจณรงค์") + '</span></div>' }) });

const hud = document.getElementById("hud");
function applyLayers() {
  const showZ = document.getElementById("zones").checked, showR = document.getElementById("rsus").checked;
  Object.values(state).forEach(S => {
    const on = document.querySelector('input[data-id="' + S.d.id + '"]').checked;
    S.on = on;
    [S.g, S.carMk].forEach(l => on ? l.addTo(map) : map.removeLayer(l));
    (on && showZ ? S.gz.addTo(map) : map.removeLayer(S.gz));
    (on && showR ? S.gr.addTo(map) : map.removeLayer(S.gr));
    if (!on) { closeBub(S); closeLcs(S); }

document.querySelectorAll("#rts input").forEach(i => i.onchange = () => { applyLayers(); fitActive(); });

function activeStates() { return Object.values(state).filter(S => S.on); }
function fitActive() {
  const a = activeStates(); if (!a.length) return;
  let b = null; a.forEach(S => { const bb = L.latLngBounds(S.R.path.map(p => [p[0], p[1]])); b = b ? b.extend(bb) : bb; });
  map.fitBounds(b, { padding: [40, 40] });

function closeLcs(S) { if (S.lcsMk) { map.removeLayer(S.lcsMk); S.lcsMk = null; S.lcsKey = null; } }
function openLcs(S, l, idx) {
  closeLcs(S);

  S.lcsMk = L.marker([l.lat, l.lon], { zIndexOffset: 7000, interactive: false, icon: L.divIcon({ className: "", iconSize: [0, 0], html: html }) }).addTo(map);

}
function closeBub(S) { if (S.bub) { map.removeLayer(S.bub); S.bub = null; S.bubScene = null; S.bubKey = null; } }

// ---- T3: emergency vehicle comes from behind, overtakes, leaves the expressway ----
function emgIcon() { return L.divIcon({ className: "", iconSize: [34, 34], iconAnchor: [17, 17], html: '<div class="emg"><svg viewBox="0 0 24 24"><path d="M3 14 L5 8 Q6 6 8 6 H16 Q18 6 19 8 L21 14 V18 H3Z" fill="#fff"/><rect x="9" y="2" width="6" height="4" rx="1.5" class="sir"/><circle cx="7" cy="18" r="2.3" fill="#fff" stroke="#111" stroke-width="1.2"/><circle cx="17" cy="18" r="2.3" fill="#fff" stroke="#111" stroke-width="1.2"/></svg><span class="carlab" style="--c:#ff3b30;color:#fff">รถฉุกเฉิน</span></div>' }); }
function bubEmg(S, s) {
  closeBub(S);
  const html = '<div class="bub" style="position:absolute;left:0;bottom:30px;--c:#ff3b30"><div class="hd" style="color:#fff"><span>' + S.B.name + ' · T3</span><span>EMERGENCY</span></div>' +
    '<div class="pics">' + SVG.emg + '</div><div class="nm">' + NAMES["T3"] + '</div><div class="msg" data-m style="color:#ff6b5e"></div>' +
    '<div class="zn" data-d style="font-size:15px;font-weight:700;color:#172033"></div></div>';
  S.bub = L.marker(S.carMk.getLatLng(), { zIndexOffset: 8000, interactive: false, icon: L.divIcon({ className: "", iconSize: [244, 0], iconAnchor: [122, 0], html: html }) }).addTo(map);
  S.bubScene = s; S.bubKey = "emg";
}
function offsetLL(R, c, m) {   // point at cum c shifted m metres to the right of travel direction
  const a = posAt(R, c - 20), b = posAt(R, c + 20), p = posAt(R, c);
  const e = (b[1] - a[1]) * Math.cos(p[0] * Math.PI / 180), n = b[0] - a[0], L2 = Math.hypot(e, n) || 1;
  const re = n / L2, rn = -e / L2;
  return [p[0] + rn * m / 110574, p[1] + re * m / (111320 * Math.cos(p[0] * Math.PI / 180))];
}
function stepEmg(S, s, v, dt) {
  const E = S.emg; E.c += v * 1.5 * dt;
  const gap = S.c - E.c, lead = E.c - S.c;      // gap>0: emergency vehicle is behind us
  let off = 0, op = 1;
  if (lead > 350) { const t = Math.min(1, (lead - 350) / 250); off = 38 * t; op = 1 - t; }
  E.mk.setLatLng(offsetLL(S.R, E.c, off)); E.mk.setOpacity(op);
  const el = S.bub && S.bub.getElement(); if (!el) return;
  const m = el.querySelector("[data-m]"), d = el.querySelector("[data-d]"), ad = Math.round(Math.abs(gap) / 5) * 5;
  if (gap > 40) { m.textContent = "EMERGENCY VEHICLE BEHIND · GIVE WAY"; d.textContent = "ระยะห่าง " + ad + " ม. (อยู่ด้านหลัง)"; }
  else if (gap >= -40) { m.textContent = "EMERGENCY VEHICLE PASSING · KEEP CLEAR"; d.textContent = "ระยะห่าง " + ad + " ม. (กำลังแซง)"; }
  else { m.textContent = "EMERGENCY VEHICLE AHEAD · PROCEED"; d.textContent = "ระยะห่าง " + ad + " ม. (อยู่ด้านหน้า)"; }
  if (lead > 600) { map.removeLayer(E.mk); S.emg = null; S.emgDone = true; closeBub(S); }
}

// ---------------- animation ----------------
let playing = false, last = null;
const BASE = 220;       // m/s of simulated travel at 1x
const SLOW = 0.3;       // speed factor while inside a use-case window
const SLOW_T3 = 0.25;
function windowOf(s) {
  if (!s.zones.length) return [s.cum - 150, s.cum + 2800];
  return [Math.min(s.cum, ...s.zones.map(z => z.a)), Math.max(s.cum, ...s.zones.map(z => z.b))];
}
function stepRoute(S, dt, mult) {
  if (S.done) return;
  let f = 1; S.R.scenes.forEach(s => { const w = windowOf(s); if (S.c >= w[0] && S.c <= w[1]) f = s.tc === "T3" ? SLOW_T3 : SLOW; });
  const v = BASE * mult * f;
  S.c += v * dt;
  if (S.c >= S.R.len) { S.c = S.R.len; S.done = true; }
  S.carMk.setLatLng(posAt(S.R, S.c));
  // T3: emergency vehicle starts at the use-case point once our car is 250 m past it
  const t3 = S.R.scenes.find(s => s.tc === "T3");
  if (t3 && !S.emg && !S.emgDone && S.c >= t3.cum + 250 && S.c < t3.cum + 1500) {
    S.emg = { c: t3.cum, mk: L.marker(posAt(S.R, t3.cum), { icon: emgIcon(), zIndexOffset: 6000, interactive: false }).addTo(map) };
    bubEmg(S, t3);
  }
  if (S.emg) stepEmg(S, t3, v, dt);
  else if (S.bubKey !== "emg") {
    // other use cases: popup from the start of the Detection Zone, switching zone by zone
    let cur = null, cz = null;
    for (const s of S.R.scenes) {
      if (!s.zones.length) continue;
      const a = Math.min(...s.zones.map(z => z.a)), b = Math.max(...s.zones.map(z => z.b));
      if (S.c >= a && S.c <= b) { cur = s; cz = s.zones.find(z => S.c >= z.a && S.c <= z.b) || s.zones[0]; break; }
    }
    const key = cur ? cur.key + "|" + cz.n : null;
    if (key !== S.bubKey) { if (cur) openBub(S, cur, cz, key); else closeBub(S); }
  }
  if (S.bub) S.bub.setLatLng(S.carMk.getLatLng());
  // LCS gantry card: shown when the car reaches each gantry (start of a Relevant Zone), stays ~450 m
  if (S.R.lcs && S.R.lcs.length) {
    let cl = null, ci = -1; S.R.lcs.forEach((l, i) => { if (S.c >= l.cum - 20 && S.c <= l.cum + 450) { cl = l; ci = i; } });
    if (cl && S.lcsKey !== cl.id) openLcs(S, cl, ci); else if (!cl && S.lcsKey) closeLcs(S);
  }
  // highlight active zones
  S.R.scenes.forEach(s => s.zones.forEach(z => { const a = S.c >= z.a && S.c <= z.b; z.line.setStyle({ weight: a ? 13 : 8, opacity: a ? 1 : .8 }); }));
}
function frame(t) {
  if (!playing) { last = null; return; }
  if (last == null) last = t;
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  const mult = parseFloat(document.getElementById("spd").value);
  const act = activeStates();
  act.forEach(S => stepRoute(S, dt, mult));
  if (document.getElementById("view").value === "near" && act.length) {
    const live = act.filter(S => !S.done); const f = (live[0] || act[0]);
    if (map.getZoom() < 14) map.setView(f.carMk.getLatLng(), 15, { animate: false }); else map.panTo(f.carMk.getLatLng(), { animate: false });
  }

}
function setPlaying(p) {

}
document.getElementById("bPlay").onclick = () => {
  const a = activeStates(); if (!a.length) { alert("กรุณาเลือกเส้นทางอย่างน้อย 1 เส้น"); return; }
  if (a.every(S => S.done)) restart();
  setPlaying(!playing);
};
function restart() {
  Object.values(state).forEach(S => { S.c = 0; S.done = false; if (S.emg) { map.removeLayer(S.emg.mk); S.emg = null; } S.emgDone = false; closeBub(S); closeLcs(S); S.carMk.setLatLng(posAt(S.R, 0)); S.R.scenes.forEach(s => s.zones.forEach(z => z.line.setStyle({ weight: 8, opacity: .8 }))); });
  renderHud(); fitActive();
}
document.getElementById("bRestart").onclick = () => { restart(); if (!playing) return; last = null; };


// ---------------- seek: click / drag on a progress bar ----------------
function seek(S, frac) {
  frac = Math.max(0, Math.min(1, frac));
  S.c = frac * S.R.len; S.done = frac >= 1;
  if (S.emg) { map.removeLayer(S.emg.mk); S.emg = null; }
  const t3 = S.R.scenes.find(s => s.tc === "T3");
  S.emgDone = !!(t3 && S.c > t3.cum + 1500);
  closeBub(S); closeLcs(S);
  S.carMk.setLatLng(posAt(S.R, S.c));
  if (!S.done) stepRoute(S, 0, 1);
  if (document.getElementById("view").value === "near") map.setView(S.carMk.getLatLng(), Math.max(map.getZoom(), 14), { animate: false });
  renderHud();
}
let seeking = null;
function seekFrom(e) {
  const bar = hud.querySelector('.bar[data-id="' + seeking + '"]'); if (!bar) return;
  const r = bar.getBoundingClientRect(); seek(state[seeking], (e.clientX - r.left) / r.width);
}
hud.addEventListener("pointerdown", e => { const bar = e.target.closest(".bar"); if (!bar) return; seeking = bar.dataset.id; seekFrom(e); e.preventDefault(); });
window.addEventListener("pointermove", e => { if (seeking) seekFrom(e); });
window.addEventListener("pointerup", () => { seeking = null; });
function renderHud() {
  const a = activeStates();
  hud.style.display = a.length ? "block" : "none";
  hud.innerHTML = a.map(S => {
    const pct = S.c / S.R.len * 100, nxt = S.R.scenes.find(s => s.cum > S.c);
    let st;
    if (S.done) st = "<b>ถึงปลายทางแล้ว</b> — ครบ " + S.R.scenes.length + " use case";
    else if (S.bubScene) st = "<b>" + S.bubScene.tc + "</b> " + NAMES[S.bubScene.tc];
    else if (nxt) st = "ถัดไป: <b>" + nxt.tc + "</b> " + NAMES[nxt.tc] + " (อีก " + Math.max(0, Math.round((nxt.cum - S.c) / 100) * 100) + " ม.)";
    else st = "กำลังวิ่งไปยังปลายทาง";
    return '<div class="hr"><div class="t"><span style="color:' + S.B.color + '">● ' + S.B.name + ' ' + S.d.th + '</span><span class="km">' + fmtKm(kmAt(S.R, S.c)) + '</span></div>' +
      '<div class="bar" data-id="' + S.d.id + '" style="--c:' + S.B.color + '">' + S.R.scenes.map(s => '<b style="left:' + (s.cum / S.R.len * 100) + '%"></b><em style="left:' + (s.cum / S.R.len * 100) + '%">' + s.tc.replace("T2&T4&T5", "T2·4·5").replace("T4&T5", "T4·5") + '</em>').join("") + '<i style="width:' + pct + '%;background:' + S.B.color + '"></i><u style="left:' + pct + '%"></u></div><div class="st">' + st + '</div></div>';
  }).join("");
}

// default: show Kapsch outbound
document.querySelector('input[data-id="K_out"]').checked = true;
applyLayers(); fitActive();
window.addEventListener("load", () => { map.invalidateSize(); fitActive(); });
</script>
